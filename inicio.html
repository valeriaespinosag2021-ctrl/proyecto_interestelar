<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interestelar</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:white;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
}

h1{
    color:#58a6ff;
}

.contenedor{
    width:90%;
    margin:auto;
    margin-top:40px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.tarjeta{
    background:#161b22;
    border-radius:15px;
    padding:20px;
    text-align:center;
}

.tarjeta img{
    width:170px;
    height:170px;
    object-fit:cover;
    border-radius:50%;
}

button{
    background:#238636;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#2ea043;
}

</style>

</head>

<body>

<header>

<h1>🌌 INTERESTELAR 🌌</h1>

<h2>Sistema Solar</h2>

<p>Selecciona un planeta para explorarlo.</p>

</header>

<div class="contenedor">

{% for planeta in planetas %}

<div class="tarjeta">

<h2>{{ planeta.nombre }}</h2>

{% if planeta.ruta_ilustracion %}

<img src="{{ url_for('static', filename='img/' + planeta.ruta_ilustracion) }}">

{% endif %}

<p>

{{ planeta.descripcion[:120] }}...

</p>

<a href="{{ url_for('planeta', id_planeta=planeta.id_planeta) }}">

<button>

Explorar

</button>

</a>

</div>

{% endfor %}

</div>

</body>

</html>
